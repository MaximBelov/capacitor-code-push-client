name: CI
# One workflow for what a change goes through, parameterised by what triggered it (see `plan`):
#
#   a pull request  runs the tests its change needs, and ends in `ci`, the one job a ruleset on main can require;
#   a push to main  does the same for everything, then publishes the version in package.json to npm;
#   a run by hand   (workflow_dispatch) tests everything and never publishes. It is how a pull request that a workflow opened gets its
#                   checks: one opened with the repository's token starts no pull_request run, so pins.yaml starts this on its branch.
#
# npm's trusted publishing is tied to this file name: the package's Settings > Trusted Publisher on npmjs.com names this repository and
# this file (ci.yaml), with no environment. There is no npm token to expire. A push that keeps the version publishes nothing, so a
# release is a version bump merged to main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request cancels the run before it. A push to main never cancels another: it may be the one that publishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The two platforms, the TypeScript bridge and the web stub have to agree before anything longer is run: every native call is
  # declared, registered and implemented on both platforms, and the npm package ships no tests. It costs seconds.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx vitest run test/unit/platform-parity.test.ts
  # Everything that depends on what triggered the run is decided here, once:
  #   ios, android  which of the longer tests are needed: all of them for a push or a run by hand, and for a pull request the ones whose
  #                 code, tests or shared files (the TypeScript, the demo, the end-to-end scenario, the fixtures, the manifest, the
  #                 coverage floors, the workflow) it changes
  #   publish       whether the run ends in a publish: a push to main, and nothing else. Trusted publishing is tied to this file's name and
  #                 not to a branch, so a run by hand on any branch would publish the version it carries if this said yes
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "$files"
            shared='src/|demo/|test/e2e/|test/fixtures/|test/coverage/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yaml$'
            ios=$(echo "$files" | grep -Eq "^(ios/|test/ios/|Package\.swift$|$shared|\.github/workflows/test-ios\.yaml$)" && echo true || echo false)
            android=$(echo "$files" | grep -Eq "^(android/|$shared|\.github/workflows/test-android\.yaml$)" && echo true || echo false)
            publish=false
          else
            ios=true
            android=true
            publish=false
            if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
              publish=true
            fi
          fi
          {
            echo "ios=$ios"
            echo "android=$android"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  unit:
    needs: parity
    uses: ./.github/workflows/test.yaml
  ios:
    needs: [parity, plan]
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/test-ios.yaml
  android:
    needs: [parity, plan]
    if: needs.plan.outputs.android == 'true'
    uses: ./.github/workflows/test-android.yaml
  # The one job a ruleset requires. A job that was skipped because the change does not need it is fine; one that failed or was
  # cancelled is not.
  ci:
    if: always()
    needs: [parity, plan, unit, ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.parity.result }} ${{ needs.plan.result }} ${{ needs.unit.result }} ${{ needs.ios.result }} ${{ needs.android.result }}
        run: |
          echo "parity plan unit ios android: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job did not pass"; exit 1 ;;
            esac
          done
  # Only a push to main gets here, and only when `ci` is green. It publishes a version that npm does not have yet, and nothing when the
  # version is already there. It stays off until the repository variable NPM_PUBLISH is `true` (Settings > Secrets and variables >
  # Actions > Variables), which is set once the package exists on npm and its Trusted Publisher names this workflow.
  publish:
    needs: [plan, ci]
    if: success() && needs.plan.outputs.publish == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the release
      id-token: write # npm's trusted publishing signs in with this
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # the whole history: the tag goes on the commit that first carried the version
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          # npm 11.5 or newer is needed for trusted publishing
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # a publishing job does not restore a dependency cache (setup-node's advice for trusted publishing)
          package-manager-cache: false
      - run: npm ci
      - name: Publish a version that is new
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # The name is not ours until somebody checks: an unrelated package on npm under the same name would hold this version, and
          # the check below would then say "already published" and skip without a word. Refuse instead.
          published=$(npm view "$name" repository.url 2>/dev/null || true)
          if [ -n "$published" ] && ! echo "$published" | grep -qi "$REPOSITORY"; then
            echo "$name on npm belongs to another repository: $published"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published: nothing to do"
            exit 0
          fi
          # prepublishOnly builds dist/ (docgen, tsc, rollup)
          npm publish --access public --provenance
      - name: Tag and release the version that is on npm
        # After the publish, and only after it: the tag goes on the commit the version was published from (the first one on main that
        # carries it), and the release takes the version's block of the changelog. Both are left alone when they exist, so a re-run adds
        # what is missing and changes nothing else.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          commit=$(node scripts/release.mjs commit "$version")
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already on origin"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" -m "$version" "$commit"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists"
          else
            node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          fi

name: iOS tests
# The Swift: the core under XCTest on the macOS host, the whole package built for a device, and the demo app against a local CodePush
# server on an iOS simulator. The jobs are independent and run side by side. Called by ci.yaml when something they cover changes, and for
# every push to main. Capacitor 8 needs Xcode 26, so macos-26.
on:
  workflow_call:
jobs:
  # XCTest of the Swift core with `swift test` (test/ios), with its floor: the core is Foundation, CryptoKit and ZIPFoundation, the same
  # APIs as on iOS, so it needs no simulator. Then the whole Swift package, Capacitor glue included, built for a device; the glue runs on a
  # simulator in `e2e`.
  xctest:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm run test:ios:coverage
      - run: npm run verify:ios
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-ios
          path: coverage/ios.json
          if-no-files-found: ignore
      # A cancelled run leaves xcodebuild running, which slows the runner's own clean-up for minutes.
      - name: Stop what the tests left running
        if: always()
        run: pkill -f '[x]codebuild' || true
  # The demo app, built on the packed plugin, against a local CodePush server on an iOS simulator: install, cold start on a package,
  # rollback of one that never confirms, a diff, and the reset a new binary makes (test/e2e/run-ios.mjs). A simulator shares the runner's
  # network, so nothing has to be forwarded.
  e2e:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:e2e:ios
      - name: Stop what the tests left running
        if: always()
        run: |
          pkill -f '[x]codebuild' || true
          xcrun simctl shutdown all || true
